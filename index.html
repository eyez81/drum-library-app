<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>Drum Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">DL</div>
      <div><strong>DRUM LIBRARY</strong><span>הספרייה האישית של התופים והמצילות</span></div>
    </div>
    <nav class="top-nav" aria-label="תצוגת ספרייה">
      <button class="nav-tab active" data-view="kits" type="button">מערכות <span id="kitsNavCount">0</span></button>
      <button class="nav-tab" data-view="standalone" type="button">פריטים בודדים <span id="partsNavCount">0</span></button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow">E-DRUM SOUND CATALOG</div>
        <h1>2box drumit 5 mk2 sounds</h1>
        <p></p>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="library-switch" aria-label="בחירת סוג תוכן">
      <button class="library-card active" data-view="kits" type="button">
        <span class="library-icon">◉</span>
        <span><b>מערכות תופים</b><small>Kit מלא עם כל התופים והמצילות</small></span>
        <strong id="kitsSwitchCount">0</strong>
      </button>
      <button class="library-card" data-view="standalone" type="button">
        <span class="library-icon cymbal">●</span>
        <span><b>תופים ומצילות בודדים</b><small>פריטים שהותקנו בנפרד, ללא מערכת מלאה</small></span>
        <strong id="partsSwitchCount">0</strong>
      </button>
    </section>

    <section class="search-panel" aria-label="חיפוש וסינון">
      <div class="searchbox">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="למשל: Black Beauty, Sabian, 24″, Ride, Tama..." />
        <button id="clearSearch" class="clear-btn" type="button" title="נקה חיפוש">×</button>
      </div>
      <div class="filters">
        <select id="expansionFilter"><option value="">כל ההרחבות</option></select>
        <select id="formatFilter"><option value="">SDX / EZX</option></select>
        <select id="engineerFilter"><option value="">כל הטכנאים / מפיקים</option></select>
        <select id="brandFilter"><option value="">כל החברות</option></select>
        <select id="typeFilter"><option value="">כל סוגי הכלים</option></select>
        <select id="sizeFilter"><option value="">כל הגדלים</option></select>
        <button id="resetFilters" class="reset-btn" type="button">איפוס</button>
      </div>
    </section>

    <section class="results-head">
      <div><span id="resultCount">0</span> <span id="resultLabel">מערכות</span></div>
      <div class="view-hint" id="viewHint">לחיצה על מערכת פותחת פירוט מלא</div>
    </section>

    <section id="kitGrid" class="kit-grid"></section>
    <section id="standaloneGrid" class="part-library-grid hidden"></section>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">⌕</div>
      <h2 id="emptyTitle">לא נמצאו תוצאות</h2>
      <p id="emptyText">נסה שם של חברה, דגם, כלי או גודל אחר.</p>
    </div>
  </main>

  <dialog id="kitDialog" class="kit-dialog">
    <div id="dialogContent"></div>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
